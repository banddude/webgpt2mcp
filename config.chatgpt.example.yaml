logLevel: info

server:
  port: 3000
  # Use a private value with at least 10 characters.
  auth: sk-your-webai2api-key

backend:
  pool:
    instances:
      - name: "browser_chatgpt"
        workers:
          - name: "chatgpt_text_worker"
            type: chatgpt_text

browser:
  path: ""
  # Use false for first login/debugging. Use true only after login is stable.
  headless: false
  humanizeCursor: false
  fission: false
  cssInject:
    animation: true
    filter: true
    font: false

  proxy:
    enable: false
    type: http
    host: 127.0.0.1
    port: 7890
    # user: username
    # passwd: password
